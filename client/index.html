<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F6EF" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AgroSphere - AI-Powered Smart Agriculture Ecosystem</title>
    <script>
      (function() {
        var saved = localStorage.getItem('agrosphere_theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', saved === 'dark' ? '#071810' : '#F7F6EF');
        }
      })();
    </script>
    <!-- Google Fonts: Playfair Display, Poppins, Dancing Script -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- FontAwesome 6 for visual icon harmony with Sarab template -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
